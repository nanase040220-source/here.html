<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord | ログイン</title>
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="サーバーへの招待を受け取りました">
    <meta property="og:description" content="Discordで友達やコミュニティと一緒に過ごしましょう。チャット、ボイス、ビデオでつながることができます。">
    <meta property="og:image" content="https://discord.com/assets/ee7c382d92576551b885.png">
    <meta name="theme-color" content="#5865F2">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="bg-art-left"></div>
        <div class="bg-art-right"></div>

        <div class="login-card">
            <div class="login-header">
                <div class="logo-container">
                    <svg class="discord-logo" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.71,32.65-1.82,56.6.39,80.21a105.73,105.73,0,0,0,32.17,16.15,77.7,77.7,0,0,0,6.89-11.11,68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.72-27.31-4.82-51.13-19.65-72.14ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z" fill="white"/>
                    </svg>
                    <span class="logo-text">Discord</span>
                </div>
                <h2>おかえりなさい！</h2>
                <p>また会えて嬉しいです！</p>
            </div>
            
            <form class="login-form">
                <div class="form-group">
                    <label>メールアドレスまたは電話番号 <span class="required">*</span></label>
                    <input type="text" name="email" required>
                </div>
                
                <div class="form-group">
                    <label>パスワード <span class="required">*</span></label>
                    <input type="password" name="password" required>
                    <a href="#" class="forgot-password">パスワードをお忘れですか？</a>
                </div>
                
                <button type="submit" class="login-button">ログイン</button>
                
                <div class="register-text">
                    アカウントが必要ですか？ <a href="#">登録</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
